name: Build WrtMax CR6606

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'configs/**'
      - 'diy.sh'
      - 'files/**'
      - 'packages/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout WrtMax source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib             gettext git libncurses-dev libssl-dev python3 python3-distutils python3-setuptools             rsync unzip zlib1g-dev file wget curl time

      - name: Cache OpenWrt downloads and staging
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
          key: openwrt-24.10-${{ runner.os }}-${{ hashFiles('configs/cr6606.config', 'diy.sh') }}
          restore-keys: |
            openwrt-24.10-${{ runner.os }}-

      - name: Clone OpenWrt 24.10
        run: |
          git clone --depth 1 --branch openwrt-24.10 https://github.com/openwrt/openwrt.git openwrt
          test -d openwrt/target/linux/ramips

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify target profile
        working-directory: openwrt
        run: |
          grep -Rqs 'xiaomi_cr6606' target/linux/ramips
          if ! grep -Rqs 'xiaomi_cr6606' target/linux/ramips; then
            echo "::error::The requested xiaomi_cr6606 profile is not present in this OpenWrt branch. Confirm the exact supported profile before building."
            exit 1
          fi

      - name: Copy WrtMax packages and files
        run: |
          mkdir -p openwrt/package/wrtmax
          cp -a packages/. openwrt/package/wrtmax/
          cp -a files/. openwrt/files/

      - name: Apply WrtMax build customizations
        run: |
          chmod +x diy.sh
          ./diy.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Configure firmware
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/configs/cr6606.config" .config
          make defconfig
          grep -q 'CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_cr6606=y' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware and checksums
        run: |
          mkdir -p release
          find openwrt/bin/targets/ramips/mt7621 -maxdepth 1 -type f \( -name '*.bin' -o -name '*.manifest' \) -exec cp {} release/ \;
          test -n "$(find release -maxdepth 1 -name '*.bin' -print -quit)"
          (cd release && sha256sum *.bin > SHA256SUMS)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WrtMax-CR6606-firmware
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
