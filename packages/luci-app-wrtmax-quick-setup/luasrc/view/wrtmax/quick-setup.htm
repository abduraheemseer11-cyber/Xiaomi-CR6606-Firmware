<%+header%>
<style>
.wm-card{padding:16px;margin:12px 0;border-radius:12px;background:var(--background-color-high)}
.wm-card button,.wm-card input,.wm-card select{width:100%;min-height:44px;margin:6px 0;padding:9px}
.wm-output{white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto}
</style>
<h2>WrtMax Quick Setup</h2>
<div class="wm-card"><h3>Status</h3><pre class="wm-output"><%=pcdata(status or "")%></pre>
<form method="post"><label>Mode</label><select name="arg"><option value="ap">Access Point</option><option value="wisp">WISP / Repeater</option><option value="router-dhcp">Home Router DHCP</option><option value="router-pppoe">Home Router PPPoE</option><option value="bridge">Wireless Bridge</option></select>
<button name="action" value="apply" onclick="return confirm('Apply network mode? Connectivity may be interrupted.');">Apply mode</button></form></div>
<% if result and result ~= "" then %>
<div class="wm-card"><h3>Result</h3><pre class="wm-output"><%=pcdata(result)%></pre></div><% end %>
<%+footer%>
